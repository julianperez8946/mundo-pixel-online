
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mundo Pixel Online</title>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  font-family: system-ui, sans-serif;
}
body {
  margin: 0;
  background: #101c27;
  color: #fff;
  overflow: hidden;
}
button, input { font: inherit; }
button {
  border: 0;
  border-radius: 10px;
  padding: 11px 14px;
  background: #377de5;
  color: white;
  font-weight: 700;
  cursor: pointer;
}
button:disabled { opacity: .5; }
input {
  min-width: 0;
  width: 100%;
  padding: 11px;
  border: 1px solid #516275;
  border-radius: 9px;
  color: white;
  background: #192b3a;
}
#login {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 20px;
  background: radial-gradient(circle at top, #274e62, #101c27 70%);
}
.panel {
  width: min(420px, 100%);
  padding: 25px;
  background: #1b2d3c;
  border: 1px solid #40576a;
  border-radius: 18px;
  box-shadow: 0 20px 70px #0008;
}
.panel h1 { margin-top: 0; }
.panel p { color: #c4d2dc; line-height: 1.5; }
#loginForm { display: flex; gap: 8px; }
#error { color: #ff9e9e; min-height: 24px; }
#game {
  display: none;
  height: 100dvh;
  grid-template-rows: auto 1fr;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px;
  background: #172735;
  border-bottom: 1px solid #314758;
}
#brand { font-weight: 900; }
#status { font-size: 12px; color: #b7cbd8; }
#layout {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
}
#worldWrap {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: #78b956;
}
#world {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
#hint {
  position: absolute;
  top: 10px;
  left: 10px;
  max-width: calc(100% - 20px);
  padding: 7px 10px;
  border-radius: 9px;
  background: #10251dcc;
  font-size: 12px;
  pointer-events: none;
}
#side {
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: #172735;
  border-left: 1px solid #314758;
}
.sectionTitle {
  padding: 12px 13px 6px;
  font-size: 13px;
  font-weight: 800;
}
#players {
  max-height: 30%;
  overflow: auto;
  padding: 0 8px 8px;
}
.playerRow {
  padding: 7px 8px;
  border-radius: 7px;
  color: #dce9f2;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.playerRow.me { background: #29435a; }
#chatLog {
  flex: 1;
  min-height: 90px;
  overflow-y: auto;
  padding: 8px 12px;
  background: #12212d;
  font-size: 12px;
  overflow-wrap: anywhere;
}
.chatLine { margin-bottom: 9px; line-height: 1.4; }
.chatLine strong { color: #91c7ff; }
.system { color: #a8bdca; font-style: italic; }
#chatForm {
  display: flex;
  gap: 6px;
  padding: 9px;
}
#chatForm button { padding: 9px 11px; }
#actions { padding: 0 10px 10px; }
#actions button { width: 100%; }
#mobileControls {
  display: none;
  position: absolute;
  bottom: 12px;
  left: 12px;
  z-index: 2;
  grid-template-columns: repeat(3, 48px);
  grid-template-rows: repeat(2, 44px);
  gap: 5px;
  touch-action: none;
}
.moveBtn {
  background: #183043dc;
  border: 1px solid #ffffff60;
  font-size: 20px;
  padding: 0;
  user-select: none;
  touch-action: none;
}
.moveBtn[data-dir="up"] { grid-column: 2; grid-row: 1; }
.moveBtn[data-dir="left"] { grid-column: 1; grid-row: 2; }
.moveBtn[data-dir="down"] { grid-column: 2; grid-row: 2; }
.moveBtn[data-dir="right"] { grid-column: 3; grid-row: 2; }
@media (max-width: 720px) {
  #layout {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) 185px;
  }
  #side {
    border-left: 0;
    border-top: 1px solid #314758;
  }
  #players, #actions, #side > .sectionTitle:first-child {
    display: none;
  }
  #chatLog { min-height: 0; }
  #chatForm { padding: 6px; }
  #chatForm input { padding: 8px; }
  #chatForm button { padding: 8px; }
  #mobileControls { display: grid; }
  header { padding: 8px 10px; }
}
</style>
</head>
<body>

<div id="login">
  <div class="panel">
    <h1>🌎 Mundo Pixel Online</h1>
    <p>Entra a un mundo compartido. Camina, conoce jugadores y conversa en tiempo real.</p>
    <form id="loginForm">
      <input id="nameInput" maxlength="18" minlength="2"
        placeholder="Tu nombre de jugador" autocomplete="nickname" required>
      <button id="joinBtn" type="submit">Entrar</button>
    </form>
    <p id="error" role="status"></p>
    <small>Necesitas conexión a Internet para jugar online.</small>
  </div>
</div>

<div id="game">
  <header>
    <div id="brand">🌎 Mundo Pixel</div>
    <div id="status">Conectando...</div>
  </header>
  <div id="layout">
    <div id="worldWrap">
      <canvas id="world"></canvas>
      <div id="hint">Muévete con WASD o las flechas. Acércate para saludar.</div>
      <div id="mobileControls">
        <button class="moveBtn" data-dir="up" aria-label="Arriba">▲</button>
        <button class="moveBtn" data-dir="left" aria-label="Izquierda">◀</button>
        <button class="moveBtn" data-dir="down" aria-label="Abajo">▼</button>
        <button class="moveBtn" data-dir="right" aria-label="Derecha">▶</button>
      </div>
    </div>
    <aside id="side">
      <div class="sectionTitle">👥 Jugadores conectados</div>
      <div id="players"></div>
      <div class="sectionTitle">💬 Chat del mundo</div>
      <div id="chatLog" aria-live="polite"></div>
      <div id="actions">
        <button id="greetBtn" disabled>👋 Saludar al jugador cercano</button>
      </div>
      <form id="chatForm">
        <input id="chatInput" maxlength="180"
          placeholder="Escribe un mensaje..." autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
    </aside>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const socket = io({ autoConnect: false });

  const $ = id => document.getElementById(id);
  const login = $("login");
  const game = $("game");
  const canvas = $("world");
  const ctx = canvas.getContext("2d");
  const nameInput = $("nameInput");
  const error = $("error");
  const status = $("status");
  const chatLog = $("chatLog");
  const playerList = $("players");
  const greetBtn = $("greetBtn");

  let myId = null;
  let myName = "";
  let world = { width: 2400, height: 1600 };
  let players = [];
  let joined = false;
  let camera = { x: 0, y: 0 };
  let lastFrame = performance.now();
  let lastMoveSent = "";
  let lastMoveTime = 0;
  let trees = [];
  let flowers = [];

  // Elementos decorativos deterministas para que el mapa
  // se vea igual en los navegadores de todos los jugadores.
  let seed = 7319;
  function random() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  }
  for (let i = 0; i < 180; i++) {
    trees.push({
      x: 40 + random() * (world.width - 80),
      y: 40 + random() * (world.height - 80),
      size: 18 + random() * 12
    });
  }
  for (let i = 0; i < 450; i++) {
    flowers.push({
      x: random() * world.width,
      y: random() * world.height,
      color: ["#fff0a6", "#f8b6d0", "#ffffff"][i % 3]
    });
  }

  function addLine(text, className = "") {
    const line = document.createElement("div");
    line.className = "chatLine " + className;
    line.textContent = text;
    chatLog.appendChild(line);
    while (chatLog.children.length > 100) {
      chatLog.removeChild(chatLog.firstChild);
    }
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function addChat(name, message) {
    const line = document.createElement("div");
    line.className = "chatLine";
    const strong = document.createElement("strong");
    strong.textContent = name + ": ";
    const span = document.createElement("span");
    span.textContent = message;
    line.append(strong, span);
    chatLog.appendChild(line);
    while (chatLog.children.length > 100) {
      chatLog.removeChild(chatLog.firstChild);
    }
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);

  $("loginForm").addEventListener("submit", event => {
    event.preventDefault();
    const name = nameInput.value.trim();
    if (name.length < 2) {
      error.textContent = "Escribe al menos 2 caracteres.";
      return;
    }
    myName = name;
    error.textContent = "Conectando al mundo...";
    $("joinBtn").disabled = true;
    if (!socket.connected) socket.connect();
    else socket.emit("join", { name: myName });
  });

  socket.on("connect", () => {
    if (!joined) socket.emit("join", { name: myName });
  });

  socket.on("connect_error", () => {
    error.textContent = "No se pudo conectar. Intenta de nuevo.";
    $("joinBtn").disabled = false;
  });

  socket.on("joinError", message => {
    error.textContent = message;
    $("joinBtn").disabled = false;
  });

  socket.on("welcome", data => {
    world = data.world;
  });

  socket.on("joined", data => {
    myId = data.id;
    world = data.world;
    players = data.players;
    joined = true;
    login.style.display = "none";
    game.style.display = "grid";
    resize();
    addLine("¡Bienvenido al mundo, " + myName + "!", "system");
    status.textContent = "Conectado · " + players.length + "/50";
    renderPlayers();
  });

  socket.on("players", data => {
    players = data;
    status.textContent =
      (socket.connected ? "Conectado" : "Desconectado") +
      " · " + players.length + "/50";
    renderPlayers();
  });

  socket.on("chatMessage", data => {
    addChat(data.name, data.message);
  });

  socket.on("systemMessage", message => addLine(message, "system"));

  socket.on("greetMessage", data => {
    addLine(data.from + " saludó a " + data.to + ".", "system");
  });

  socket.on("notice", message => addLine(message, "system"));

  socket.on("disconnect", () => {
    status.textContent = "Reconectando...";
    if (joined) addLine("Se perdió la conexión con el mundo.", "system");
  });

  function renderPlayers() {
    playerList.replaceChildren();

    for (const p of players) {
      const row = document.createElement("div");
      row.className = "playerRow" + (p.id === myId ? " me" : "");
      row.textContent = (p.id === myId ? "⭐ " : "🙂 ") + p.name;
      playerList.appendChild(row);
    }

    const me = players.find(p => p.id === myId);
    let nearest = null;
    let nearestDistance = Infinity;

    if (me) {
      for (const p of players) {
        if (p.id === myId) continue;
        const distance = Math.hypot(p.x - me.x, p.y - me.y);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearest = p;
        }
      }
    }

    greetBtn.disabled = !nearest || nearestDistance > 100;
    greetBtn.textContent =
      nearest && nearestDistance <= 100
        ? "👋 Saludar a " + nearest.name
        : "👋 Acércate a un jugador";
    greetBtn.dataset.target = nearest && nearestDistance <= 100
      ? nearest.id : "";
  }

  greetBtn.addEventListener("click", () => {
    if (greetBtn.dataset.target) {
      socket.emit("greet", greetBtn.dataset.target);
    }
  });

  $("chatForm").addEventListener("submit", event => {
    event.preventDefault();
    const input = $("chatInput");
    const message = input.value.trim();
    if (!message || !joined) return;
    socket.emit("chat", message);
    input.value = "";
    input.focus();
  });

  const keys = new Set();
  const directions = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0]
  };

  window.addEventListener("keydown", event => {
    if (["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
    if (directions[event.code]) {
      event.preventDefault();
      keys.add(event.code);
    }
  });

  window.addEventListener("keyup", event => keys.delete(event.code));
  window.addEventListener("blur", () => keys.clear());

  document.querySelectorAll(".moveBtn").forEach(button => {
    const dir = button.dataset.dir;
    const code = {
      up: "ArrowUp", down: "ArrowDown",
      left: "ArrowLeft", right: "ArrowRight"
    }[dir];

    button.addEventListener("pointerdown", event => {
      event.preventDefault();
      button.setPointerCapture(event.pointerId);
      keys.add(code);
    });
    const release = event => {
      event.preventDefault();
      keys.delete(code);
    };
    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", () => keys.delete(code));
  });

  function updateMovement(now) {
    let dx = 0, dy = 0;
    for (const code of keys) {
      const d = directions[code];
      if (d) {
        dx += d[0];
        dy += d[1];
      }
    }

    const length = Math.hypot(dx, dy);
    if (length > 0) {
      dx /= length;
      dy /= length;
    }

    const value = dx + "," + dy;
    if (value !== lastMoveSent || now - lastMoveTime > 100) {
      socket.emit("move", { dx, dy });
      lastMoveSent = value;
      lastMoveTime = now;
    }
  }

  function roundedRect(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function drawTree(x, y, size) {
    ctx.fillStyle = "#805637";
    ctx.fillRect(x - 4, y, 8, size * .8);
    ctx.fillStyle = "#286f3d";
    ctx.beginPath();
    ctx.arc(x, y - 5, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#378b48";
    ctx.beginPath();
    ctx.arc(x - size * .3, y - 10, size * .65, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#4e9d51";
    ctx.beginPath();
    ctx.arc(x + size * .28, y - 7, size * .55, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer(p, time) {
    const x = p.x, y = p.y;
    const moving = p.id === myId &&
      (Math.abs(p.dx || 0) + Math.abs(p.dy || 0) > 0);

    ctx.fillStyle = "#17351f55";
    ctx.beginPath();
    ctx.ellipse(x, y + 12, 13, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Pies
    ctx.fillStyle = "#473a36";
    ctx.fillRect(x - 8, y + 5, 6, 8);
    ctx.fillRect(x + 2, y + 5, 6, 8);

    // Cuerpo y brazos
    ctx.fillStyle = p.color;
    ctx.fillRect(x - 10, y - 7, 20, 15);
    ctx.fillRect(x - 14, y - 5, 5, 12);
    ctx.fillRect(x + 9, y - 5, 5, 12);

    // Cabeza
    ctx.fillStyle = "#f0c49a";
    ctx.fillRect(x - 8, y - 21, 16, 15);
    ctx.fillStyle = "#593a2b";
    ctx.fillRect(x - 9, y - 23, 18, 6);
    ctx.fillRect(x - 8, y - 20, 4, 4);
    ctx.fillStyle = "#272727";
    ctx.fillRect(x - 4, y - 15, 2, 2);
    ctx.fillRect(x + 3, y - 15, 2, 2);

    if (p.id === myId) {
      ctx.strokeStyle = "#fff6a3";
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 12, y - 25, 24, 41);
    }

    ctx.font = "bold 12px system-ui";
    ctx.textAlign = "center";
    const nameWidth = ctx.measureText(p.name).width + 14;
    roundedRect(x - nameWidth / 2, y - 43, nameWidth, 17, 5, "#14212be8");
    ctx.fillStyle = "#ffffff";
    ctx.fillText(p.name, x, y - 31);

    if (p.bubble && p.bubbleUntil > Date.now()) {
      const text = p.bubble.slice(0, 65);
      ctx.font = "12px system-ui";
      const bubbleWidth = Math.min(
        Math.max(ctx.measureText(text).width + 20, 55),
        190
      );
      const bx = Math.max(
        camera.x + 6,
        Math.min(x - bubbleWidth / 2, camera.x + canvas.clientWidth - bubbleWidth - 6)
      );
      roundedRect(bx, y - 72, bubbleWidth, 23, 7, "#fffdf0");
      ctx.fillStyle = "#25313a";
      ctx.fillText(text, bx + bubbleWidth / 2, y - 57, bubbleWidth - 12);
      ctx.fillStyle = "#fffdf0";
      ctx.beginPath();
      ctx.moveTo(x - 4, y - 49);
      ctx.lineTo(x + 4, y - 49);
      ctx.lineTo(x, y - 43);
      ctx.fill();
    }
  }

  function drawMap() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    // Césped base
    ctx.fillStyle = "#83c45e";
    ctx.fillRect(0, 0, w, h);

    // Textura ligera
    for (const f of flowers) {
      const x = f.x - camera.x;
      const y = f.y - camera.y;
      if (x < -5 || y < -5 || x > w + 5 || y > h + 5) continue;
      ctx.fillStyle = f.color;
      ctx.fillRect(x, y, 3, 3);
    }

    // Caminos de tierra
    ctx.fillStyle = "#d9bd83";
    ctx.fillRect(0, 330 - camera.y, w, 90);
    ctx.fillRect(530 - camera.x, 0, 100, h);
    ctx.fillStyle = "#e7d09c";
    ctx.fillRect(0, 340 - camera.y, w, 5);
    ctx.fillRect(575 - camera.x, 0, 5, h);

    // Laguna decorativa
    const pondX = 930 - camera.x, pondY = 260 - camera.y;
    ctx.fillStyle = "#5b9ed1";
    ctx.beginPath();
    ctx.ellipse(pondX, pondY, 120, 75, -.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#b4e4ed";
    ctx.lineWidth = 5;
    ctx.stroke();

    // Árboles
    for (const t of trees) {
      const x = t.x - camera.x, y = t.y - camera.y;
      if (x < -50 || y < -50 || x > w + 50 || y > h + 50) continue;
      drawTree(x, y, t.size);
    }

    // Nombre del mundo
    ctx.font = "bold 17px system-ui";
    ctx.textAlign = "center";
    ctx.fillStyle = "#284c29";
    ctx.fillText("PRADERA CENTRAL", 580 - camera.x, 300 - camera.y);
  }

  function frame(now) {
    const dt = Math.min((now - lastFrame) / 1000, .05);
    lastFrame = now;

    if (joined) {
      updateMovement(now);

      const me = players.find(p => p.id === myId);
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;

      if (me) {
        camera.x = Math.max(0, Math.min(
          world.width - w, me.x - w / 2
        ));
        camera.y = Math.max(0, Math.min(
          world.height - h, me.y - h / 2
        ));
      }

      drawMap();

      // Los personajes más al fondo se dibujan primero.
      const sorted = [...players].sort((a, b) => a.y - b.y);
      for (const p of sorted) {
        ctx.save();
        ctx.translate(-camera.x, -camera.y);
        drawPlayer(p, now);
        ctx.restore();
      }
    }

    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
